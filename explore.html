<body>
  <div id="app">
    <canvas id="triangleCanvas"></canvas>

    <header id="toolbar">
      <a href="index.html" class="home-link" title="Back to home">&larr; Home</a>
      <button id="resetViewBtn" title="Reset view">Reset view</button>

      <fieldset id="shadingCard" class="shading-card">
        <legend>Shading</legend>
        <div class="toolbar-group">
          <label><input type="radio" name="colourModeWide" value="none" /> None</label>
          <label><input type="radio" name="colourModeWide" value="technicolour" checked /> Technicolour</label>
          <label><input type="radio" name="colourModeWide" value="modulo" /> Modulo</label>
        </div>
        <div class="toolbar-group shading-modulo-row hidden" id="shadingModuloRowWide">
          <select id="shadingModulusWide">
            <option value="2">mod 2</option>
            <option value="3">mod 3</option>
            <option value="5">mod 5</option>
            <option value="7">mod 7</option>
            <option value="11">mod 11</option>
          </select>
          <span id="shadingPatternNameWide" class="shading-pattern-name hidden"></span>
        </div>
        <div class="toolbar-group shading-swatch-row hidden" id="shadingSwatchesNone">
          <label>Cell colour <input type="color" id="noneColorInput" /></label>
        </div>
        <div class="toolbar-group shading-swatch-row hidden" id="shadingSwatchesModulo">
          <label>Background <input type="color" id="shadingZeroColorInput" /></label>
          <label>Pattern <input type="color" id="shadingNonzeroColorInput" /></label>
        </div>
      </fieldset>

      <div id="shadingNarrow" class="shading-narrow">
        <select id="colourModeNarrow">
          <option value="none">None</option>
          <option value="technicolour" selected>Technicolour</option>
          <option value="modulo">Modulo</option>
        </select>
        <div class="toolbar-group shading-modulo-row hidden" id="shadingModuloRowNarrow">
          <select id="shadingModulusNarrow">
            <option value="2">mod 2</option>
            <option value="3">mod 3</option>
            <option value="5">mod 5</option>
            <option value="7">mod 7</option>
            <option value="11">mod 11</option>
          </select>
          <span id="shadingPatternNameNarrow" class="shading-pattern-name hidden"></span>
        </div>
      </div>
    </header>

    <div id="infoCard" class="hidden">
      <div class="info-row"><span class="info-label">Row (n)</span><span id="infoN"></span></div>
      <div class="info-row"><span class="info-label">Position (k)</span><span id="infoK"></span></div>
      <div class="info-row"><span class="info-label">Digits</span><span id="infoDigits"></span></div>
      <fieldset class="info-value-box">
        <legend>Value</legend>
        <div id="infoValue" class="info-value"></div>
      </fieldset>
      <fieldset id="infoSequence" class="info-sequence hidden">
        <legend>Pattern</legend>
        <div id="infoSequenceLabel" class="info-sequence-label"></div>
        <div id="infoSequenceDetail" class="info-sequence-detail"></div>
      </fieldset>
      <div id="infoNote" class="info-note"></div>
    </div>

    <div id="contextMenu" class="hidden">
      <button data-highlight="cell">Highlight cell</button>
      <button data-highlight="row">Highlight row</button>
      <button data-highlight="diagSwNe">Highlight SW&ndash;NE diagonal</button>
      <button data-highlight="diagNwSe">Highlight NW&ndash;SE diagonal</button>
      <button data-highlight="hockeyStickRight">Highlight hockey stick (right)</button>
      <button data-highlight="hockeyStickLeft">Highlight hockey stick (left)</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
